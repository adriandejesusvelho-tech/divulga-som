<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração - DIVULGA SOUND</title>
  <style>
    body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #00ff66; padding-bottom: 15px; margin-bottom: 25px; }
    .box { background: #161618; border: 1px solid #27272a; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .card { background: #202024; padding: 14px; border-radius: 8px; border: 1px solid #3f3f46; }
    .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; margin-bottom: 10px; }
    button { padding: 9px 14px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 8px; margin-right: 5px; }
    .btn-ok { background: #00ff66; color: #000; }
    .btn-no { background: #ef4444; color: #fff; }
    input, select { padding: 10px; background: #0a0a0a; border: 1px solid #3f3f46; color: #fff; border-radius: 5px; margin: 5px 5px 5px 0; }
  </style>
</head>
<body>

  <div id="painel" style="display:none;">
    <div class="header">
      <h1>PAINEL ADM <span style="color:#00ff66;">DIVULGA SOUND</span></h1>
      <a href="index.html" style="color:#00ff66; text-decoration:none;">← Voltar ao Site</a>
    </div>

    <div id="area-convites" class="box" style="display:none;">
      <h2 style="color:#00ff66; margin-bottom:10px;">Convidar Administradores</h2>
      <input type="email" id="inv-email" placeholder="E-mail do convidado">
      <select id="inv-role">
        <option value="admin_flyers">ADM de Flyers</option>
        <option value="admin_megafunk">ADM de Mega Funk</option>
        <option value="admin_geral">ADM Geral</option>
      </select>
      <button class="btn-ok" id="btn-inv">Conceder Acesso</button>
      <div id="lista-convites" style="margin-top:15px;"></div>
    </div>

    <div class="box">
      <h2 style="margin-bottom:15px;">Flyers Pendentes</h2>
      <div id="fila-flyers" class="grid">Carregando...</div>
    </div>

    <div class="box">
      <h2 style="margin-bottom:15px;">Mega Funks Pendentes</h2>
      <div id="fila-mf" class="grid">Carregando...</div>
    </div>
  </div>

  <script type="module">
    import { auth, db, SUPER_ADMIN_EMAIL } from './firebase-config.js';
    import { onAuthStateChanged } from "https://gstatic.com";
    import { collection, query, where, getDocs, doc, getDoc, updateDoc, setDoc, deleteDoc, serverTimestamp } from "https://gstatic.com";

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "index.html";

      const convite = await getDoc(doc(db, "adminInvitations", user.email));
      const isInvited = convite.exists() && convite.data().ativo === true;

      if (user.email !== SUPER_ADMIN_EMAIL && !isInvited) {
        document.body.innerHTML = "<h1 style='color:#ef4444; text-align:center; margin-top:50px;'>ACESSO NEGADO</h1>";
        return;
      }

      document.getElementById('painel').style.display = "block";
      if (user.email === SUPER_ADMIN_EMAIL) {
        document.getElementById('area-convites').style.display = "block";
        carregarConvites();
      }
      carregarFilas();
    });

    document.getElementById('btn-inv').onclick = async () => {
      const email = document.getElementById('inv-email').value.trim().toLowerCase();
      const role = document.getElementById('inv-role').value;
      if (!email) return;
      await setDoc(doc(db, "adminInvitations", email), { email, role, ativo: true, criadoEm: serverTimestamp() });
      document.getElementById('inv-email').value = "";
      carregarConvites();
    };

    async function carregarConvites() {
      const snap = await getDocs(collection(db, "adminInvitations"));
      document.getElementById('lista-convites').innerHTML = snap.docs.map(d => {
        const c = d.data();
        return `<div style="margin:6px 0;">${c.email} (${c.role}) <button class="btn-no" onclick="revogar('${d.id}')">Revogar</button></div>`;
      }).join('');
    }

    window.revogar = async (email) => { await deleteDoc(doc(db, "adminInvitations", email)); carregarConvites(); };

    async function carregarFilas() {
      const snapF = await getDocs(query(collection(db, "flyers"), where("status", "==", "pendente")));
      document.getElementById('fila-flyers').innerHTML = snapF.docs.map(d => {
        const f = d.data();
        return `<div class="card"><img src="${f.imageUrl}"><h4>${f.titulo}</h4><p style="font-size:0.8rem; color:#aaa;">${f.cidade} • ${f.autorEmail}</p><button class="btn-ok" onclick="moderar('flyers','${d.id}','aprovado')">Aprovar</button><button class="btn-no" onclick="moderar('flyers','${d.id}','recusado')">Recusar</button></div>`;
      }).join('') || "<p>Nenhum flyer pendente.</p>";

      const snapM = await getDocs(query(collection(db, "megaFunk"), where("status", "==", "pendente")));
      document.getElementById('fila-mf').innerHTML = snapM.docs.map(d => {
        const m = d.data();
        return `<div class="card"><img src="${m.coverUrl}"><h4>${m.titulo}</h4><p style="font-size:0.8rem; color:#aaa;">DJ ${m.dj}</p><a href="${m.youtubeUrl}" target="_blank" style="color:#00ff66; font-size:0.8rem;">Abrir YouTube</a><br><button class="btn-ok" onclick="moderar('megaFunk','${d.id}','aprovado')">Aprovar</button><button class="btn-no" onclick="moderar('megaFunk','${d.id}','recusado')">Recusar</button></div>`;
      }).join('') || "<p>Nenhum Mega Funk pendente.</p>";
    }

    window.moderar = async (col, id, status) => {
      const motivo = status === 'recusado' ? (prompt("Motivo da recusa:") || "Recusado pela moderação") : "";
      await updateDoc(doc(db, col, id), { status, motivoRecusa: motivo, moderadoEm: serverTimestamp() });
      carregarFilas();
    };
  </script>
</body>
</html>
